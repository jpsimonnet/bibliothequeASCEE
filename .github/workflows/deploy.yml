name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Rebuild automatique chaque nuit a 3h (recupère les dernières données Nextcloud)
    - cron: '0 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract ebooks from Calibre database
        run: node scripts/extract-ebooks.js

      - name: Download new covers from Nextcloud
        run: |
          curl -L -o couvertures.zip \
            "https://bnum.din.gouv.fr/mdrive/index.php/s/LL4kWAiiWsdmGgP/download?path=%2Fcouvertures"
          mkdir -p /tmp/couvertures
          unzip -o couvertures.zip -d /tmp/couvertures
          find /tmp/couvertures -name "*.webp" -exec cp {} src/images/covers/ \;
          # Plans de rayonnage (LF1.png, LF2.png...) affiches sur les fiches livres
          find /tmp/couvertures -name "*.png" -exec cp {} src/images/covers/ \;
          echo "Covers importees depuis Nextcloud: $(find /tmp/couvertures -name '*.webp' | wc -l)"
          echo "Plans importes depuis Nextcloud: $(find /tmp/couvertures -name '*.png' | wc -l)"
          echo "Total covers: $(ls src/images/covers/*.webp | wc -l)"
          rm -rf /tmp/couvertures couvertures.zip

      - name: Commit new covers to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/images/covers/*.webp
          git add src/images/covers/*.png || true
          git diff --cached --quiet || git commit -m "Import couvertures depuis mDrive"
          git push || true

      - name: Build with 11ty
        run: npx eleventy --pathprefix=/bibliothequeASCEE/
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NODE_ENV: "production"
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
